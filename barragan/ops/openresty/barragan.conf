worker_processes  1;
error_log  /var/lib/barragan/openresty/logs/error.log warn;
pid        /var/lib/barragan/openresty/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/lib/barragan/openresty/logs/access.log;
    sendfile    on;
    keepalive_timeout  65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    upstream barragan_fastapi {
        server 127.0.0.1:5002;
    }

    server {
        listen 127.0.0.1:5173;
        server_name _;
        root __BARRAGAN_ROOT__/frontend/dist;
        index index.html;

        location /api/ {
            proxy_pass http://barragan_fastapi;
            include __BARRAGAN_ROOT__/ops/openresty/proxy_params.conf;
            add_header Cache-Control "no-store" always;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
